<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Web de Armando</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
    
    <meta name="description" content="Portafolio moderno con navbar, footer, banner de cookies y flex box">
    <link rel="stylesheet" href="src/css/styles.css">
    <script src="src/js/main.js" defer></script>
</head>
<body>

    <a class="skip-link" href="#contenido">Saltar contenido</a>

    <header class="site-header" id="top">
        <nav class="navbar container" aria-label="Navegación principal">
            
            <a href="#inicio" class="nav__logo" aria-label="Ir a inicio">
                <img src="src/img/logo.svg" alt="Logo de Armando Jacinto Cruz">
                <span>Armando Jacinto Cruz | Portafolio Web<span class="brand-dot">.dev</span></span>
            </a>

            <div class="nav__actions">
                <ul class="navbar__menu">
                    <li><a href="#inicio">Inicio</a></li>
                    <li><a href="#sobre-mi">Sobre mí</a></li>
                    <li><a href="#proyectos">Proyectos</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                </ul>

                <a href="#contacto" class="nav__cta">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 8L12 14L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M3 8V18C3 19.1046 3.89543 20 5 20H19C20.1046 20 21 19.1046 21 18V8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    Hablemos
                </a>

                <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="mobilePanel" aria-label="Abrir Menú">
                    <span class="burger" aria-hidden="true"></span>
                </button>
            </div>

            <div class="nav__panel" id="mobilePanel" hidden>
                <ul class="nav__panelList">
                    <li><a href="#inicio" class="nav-link">Inicio</a></li>
                    <li><a href="#sobre-mi" class="nav-link">Sobre mí</a></li>
                    <li><a href="#proyectos" class="nav-link">Proyectos</a></li>
                    <li><a href="#contacto" class="nav-link">Contacto</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main id="contenido" class="section container">
        <h1>Bienvenido a mi portafolio</h1>
        <p>Aquí va el contenido de tu sitio web...</p>
    </main>

</body>
</html>
